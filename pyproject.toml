[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hazzel"
version = "1.4.2"
description = "A small terminal coding agent — bring your own keys (Groq, OpenAI, Anthropic, Mistral)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "openai",
    "mistralai",
    "anthropic",
    "rich",
]
license = { text = "AGPL-3.0-or-later" }
keywords = ["ai-agent", "coding-agent", "terminal", "cli", "llm", "developer-tools", "groq", "openai", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
hazzel = "hazzel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]